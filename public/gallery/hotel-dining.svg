<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Restaurante do resort  imagem ilustrativa">
  <defs>
    <linearGradient id="dining-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e342b"/>
      <stop offset="55%" stop-color="#3d5c4e"/>
      <stop offset="100%" stop-color="#5a7a68"/>
    </linearGradient>
    <linearGradient id="dining-floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9aab8c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a2f27"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#dining-sky)"/>
  <ellipse cx="600" cy="720" rx="520" ry="80" fill="#0f1a15" opacity="0.45"/>
  <rect y="520" width="1200" height="280" fill="url(#dining-floor)"/>
  <rect x="180" y="280" width="220" height="340" rx="8" fill="#f7f4ee" opacity="0.12"/>
  <rect x="460" y="220" width="280" height="400" rx="8" fill="#f7f4ee" opacity="0.18"/>
  <rect x="800" y="300" width="200" height="320" rx="8" fill="#f7f4ee" opacity="0.1"/>
  <circle cx="600" cy="380" r="48" fill="#c9b896" opacity="0.35"/>
  <text x="600" y="760" text-anchor="middle" fill="#e8ebe3" font-family="Georgia, serif" font-size="28" opacity="0.85">Gastronomia  ilustração fictícia</text>
</svg>
